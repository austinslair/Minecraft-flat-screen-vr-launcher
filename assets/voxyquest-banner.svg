<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-label="VoxyQuest banner inspired by the supplied Minecraft landscape artwork">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f87b1"/>
      <stop offset="0.55" stop-color="#9eb6cf"/>
      <stop offset="1" stop-color="#d7c7ad"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f94ad"/>
      <stop offset="1" stop-color="#254958"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#456244"/>
      <stop offset="1" stop-color="#172618"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#fff0b9" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff0b9" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0b1110" flood-opacity="0.45"/>
    </filter>
  </defs>

