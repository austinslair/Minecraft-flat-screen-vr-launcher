name: Feature request
description: Suggest an improvement to HorizonShelf
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Start with the user problem rather than the implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain what you would expect HorizonShelf to do.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Library / discovery
        - Search / organization
        - Launching
        - VR interaction / UI
        - Runtime integration
        - Performance
        - Documentation
        - Other
  - type: textarea
    id: context
    attributes:
      label: Additional context
