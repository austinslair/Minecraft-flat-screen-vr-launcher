name: NeoForge Quest Vivecraft feasibility

on:
  push:
    branches: [codex/neoforge-vr]

jobs:
  build-openxr-neoforge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: QuestCraftPlusPlus/VivecraftMod
          ref: 612a11ca6a30791cae34d410328bc75d08246970
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build NeoForge OpenXR variant
        run: bash ./gradlew :neoforge:remapJar --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: quest-vivecraft-neoforge-probe
          path: neoforge/build/libs/*-neoforge.jar
          if-no-files-found: error
