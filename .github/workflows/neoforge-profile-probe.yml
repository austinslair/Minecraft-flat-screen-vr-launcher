name: Inspect NeoForge client profile
on:
  push:
    branches: [codex/neoforge-vr]
    paths: [.github/workflows/neoforge-profile-probe.yml]
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download official NeoForge 1.21.5 installer
        run: |
          curl -fsSL --retry 3 https://maven.neoforged.net/releases/net/neoforged/neoforge/21.5.2-beta/neoforge-21.5.2-beta-installer.jar -o installer.jar
          unzip -p installer.jar install_profile.json > install_profile.json
          unzip -p installer.jar version.json > version.json
          python3 - <<'PY'
          import json
          for filename in ('install_profile.json', 'version.json'):
              data = json.load(open(filename))
              print(filename, {k: str(v)[:150] for k, v in data.items() if k not in ('libraries', 'processors', 'arguments')})
              print('libraries:', len(data.get('libraries', [])), 'processors:', len(data.get('processors', [])))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: neoforge-client-metadata
          path: |
            install_profile.json
            version.json
