name: Godot Android smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.1" \
            "build-tools;36.0.0" \
            "cmake;3.10.2.4988404" \
            "ndk;26.1.10909125" \
            "ndk;28.1.13356709"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"

      - name: Build Godot + Pojlib Android runtime
        env:
          VOXYQUEST_MICROSOFT_CLIENT_ID: ${{ vars.VOXYQUEST_MICROSOFT_CLIENT_ID }}
        run: gradle -p android/bridge :plugin:syncToGodot --no-daemon

      - name: Verify launcher and account runtime
        run: |
          test -f launcher/addons/VoxyQuestBridge/bin/debug/VoxyQuestBridge-debug.aar
          test -f launcher/addons/VoxyQuestBridge/bin/release/VoxyQuestBridge-release.aar
          test -f launcher/addons/VoxyQuestBridge/bin/debug/PojlibRuntime-debug.aar
          test -f launcher/addons/VoxyQuestBridge/bin/release/PojlibRuntime-release.aar
          test -f third_party/Pojlib/src/main/java/pojlib/PojlibRuntime.java
          test -f third_party/Pojlib/src/main/java/pojlib/account/LoginHelper.java
          test -f launcher/scripts/launcher.gd
          test ! -e third_party/Pojlib/src/main/java/pojlib/UnityPlayerActivity.java
          test ! -e third_party/Pojlib/libs/unity-classes.jar
          test ! -e launcher/scripts/xr_bootstrap.gd
          grep -q 'xr_features/xr_mode=0' launcher/export_presets.cfg
          grep -q 'restoreSession' third_party/Pojlib/src/main/java/pojlib/account/LoginHelper.java
          grep -q 'restoreSession' android/bridge/plugin/src/main/java/dev/voxyquest/bridge/VoxyQuestBridgePlugin.kt
          grep -q 'ATOMIC_MOVE' third_party/Pojlib/src/main/java/pojlib/account/TokenPersistence.java
          if grep -q 'openxr/enabled=true' launcher/project.godot; then
            echo "Godot launcher must remain a flat non-OpenXR app"
            exit 1
          fi
          if grep -R -n -E 'com\.unity3d|UnityPlayerActivity|restartUnitySession|method_restartUnity|blank:unity-classes|wrapper/unityLibrary' third_party/Pojlib android launcher --exclude='vivecraft-client-config.json'; then
            echo "Unity engine reference remains in active code"
            exit 1
          fi

      - name: Download Godot 4.7.2 and export templates
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"

          curl --fail --location --retry 3 -o "$RUNNER_TEMP/templates.tpz" "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          mkdir -p "$RUNNER_TEMP/templates" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          cp -R "$RUNNER_TEMP/templates/templates/." "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import Godot project
        run: "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path launcher --editor --quit"

      - name: Verify launcher empty states and account UI
        run: |
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path launcher --script res://tests/home_smoke.gd
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path launcher --script res://tests/auth_flow.gd

      - name: Create CI debug keystore
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=VoxyQuest,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Export flat Quest launcher APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p launcher/build
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --path launcher --install-android-build-template --export-debug "Meta Quest" build/VoxyQuest-ci.apk
          test -s launcher/build/VoxyQuest-ci.apk

      - name: Upload Quest debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VoxyQuest-Quest-debug
          path: launcher/build/VoxyQuest-ci.apk
          if-no-files-found: error
