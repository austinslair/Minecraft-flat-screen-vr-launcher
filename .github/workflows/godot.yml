name: Godot Android smoke test

on:
  push:
    branches: [main, fix/vr-refresh-rate]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.1" \
            "build-tools;36.0.0" \
            "cmake;3.10.2.4988404" \
            "ndk;26.1.10909125" \
            "ndk;28.1.13356709"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/checkout@v6
        with:
          repository: QuestCraftPlusPlus/VivecraftMod
          ref: 612a11ca6a30791cae34d410328bc75d08246970
          path: quest-vivecraft-openxr

      - name: Prepare NeoForge VR runtime
        run: |
          cd quest-vivecraft-openxr
          sed -i 's/^enabled_platforms=.*/enabled_platforms=neoforge/' gradle.properties
          bash ./gradlew :neoforge:remapJar --no-daemon
          cd ..
          ASSETS=third_party/Pojlib/src/main/assets/voxyquest/neoforge
          mkdir -p "$ASSETS" "$RUNNER_TEMP/neoforge-client"
          cp quest-vivecraft-openxr/neoforge/build/libs/vivecraft-1.21.5-1.3.4-neoforge.jar "$ASSETS/vivecraft.jar"
          curl -fsSL --retry 3 https://maven.neoforged.net/releases/net/neoforged/neoforge/21.5.2-beta/neoforge-21.5.2-beta-installer.jar -o "$RUNNER_TEMP/neoforge-installer.jar"
          printf '{"profiles":{}}' > "$RUNNER_TEMP/neoforge-client/launcher_profiles.json"
          java -jar "$RUNNER_TEMP/neoforge-installer.jar" --installClient "$RUNNER_TEMP/neoforge-client"
          cp "$RUNNER_TEMP/neoforge-client/versions/neoforge-21.5.2-beta/neoforge-21.5.2-beta.json" "$ASSETS/version.json"
          cp "$RUNNER_TEMP/neoforge-client/libraries/net/neoforged/neoforge/21.5.2-beta/neoforge-21.5.2-beta-client.jar" "$ASSETS/client.jar"
          cp "$RUNNER_TEMP/neoforge-client/libraries/net/neoforged/neoforge/21.5.2-beta/neoforge-21.5.2-beta-universal.jar" "$ASSETS/universal.jar"
          unzip -p "$ASSETS/vivecraft.jar" META-INF/neoforge.mods.toml | grep -q 'modId = "vivecraft"'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Godot + Pojlib Android runtime
        run: |
          bash scripts/rebuild_glfw_bridge.sh
          export VOXYQUEST_VIVECRAFT_TEST_JAR="$RUNNER_TEMP/vivecraft-original.jar"
          curl --fail --location --retry 3 https://github.com/QuestCraftPlusPlus/VivecraftMod/releases/download/1.21.5-1.2.5-OpenXR/vivecraft-1.21.5-1.2.5-fabric.jar -o "$VOXYQUEST_VIVECRAFT_TEST_JAR"
          gradle -p android/bridge :plugin:syncToGodot --no-daemon
          mkdir -p "$RUNNER_TEMP/refresh-tests"
          curl -fsSL https://repo.maven.apache.org/maven2/org/ow2/asm/asm/9.7.1/asm-9.7.1.jar -o "$RUNNER_TEMP/refresh-tests/asm.jar"
          curl -fsSL https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar -o "$RUNNER_TEMP/refresh-tests/junit.jar"
          curl -fsSL https://repo.maven.apache.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar -o "$RUNNER_TEMP/refresh-tests/hamcrest.jar"
          javac -cp "$RUNNER_TEMP/refresh-tests/*" -d "$RUNNER_TEMP/refresh-tests" third_party/Pojlib/src/main/java/pojlib/util/VivecraftRefreshRateFix.java third_party/Pojlib/src/test/java/pojlib/util/VivecraftRefreshRateFixTest.java
          java -cp "$RUNNER_TEMP/refresh-tests:$RUNNER_TEMP/refresh-tests/*" org.junit.runner.JUnitCore pojlib.util.VivecraftRefreshRateFixTest
          javac -cp "$RUNNER_TEMP/refresh-tests/*" -d "$RUNNER_TEMP/refresh-tests" third_party/Pojlib/src/main/java/pojlib/util/ClasspathUtils.java third_party/Pojlib/src/test/java/pojlib/util/ClasspathUtilsTest.java
          java -cp "$RUNNER_TEMP/refresh-tests:$RUNNER_TEMP/refresh-tests/*" org.junit.runner.JUnitCore pojlib.util.ClasspathUtilsTest

      - name: Verify launcher and account runtime
        run: |
          test -f launcher/addons/VoxyQuestBridge/bin/debug/VoxyQuestBridge-debug.aar
          test -f launcher/addons/VoxyQuestBridge/bin/release/VoxyQuestBridge-release.aar
          test -f launcher/addons/VoxyQuestBridge/bin/debug/PojlibRuntime-debug.aar
          test -f launcher/addons/VoxyQuestBridge/bin/release/PojlibRuntime-release.aar
          test -f third_party/Pojlib/src/main/java/pojlib/PojlibRuntime.java
          test -f third_party/Pojlib/src/main/java/pojlib/account/LoginHelper.java
          test -f launcher/scripts/launcher.gd
          test -f launcher/scripts/home.gd
          test ! -e launcher/scripts/instance_install_ux.gd
          test -f launcher/tests/install_bridge.gd
          grep -q 'runtime.install_instance(new_name, version)' launcher/scripts/home.gd
          grep -q 'return bool(plugin.installInstance(instance_name, version))' launcher/scripts/runtime_bridge.gd
          test ! -e third_party/Pojlib/src/main/java/pojlib/UnityPlayerActivity.java
          test ! -e third_party/Pojlib/libs/unity-classes.jar
          test ! -e launcher/scripts/xr_bootstrap.gd
          grep -q 'xr_features/xr_mode=0' launcher/export_presets.cfg
          grep -q 'restoreSession' third_party/Pojlib/src/main/java/pojlib/account/LoginHelper.java
          grep -q 'restoreSession' android/bridge/plugin/src/main/java/dev/voxyquest/bridge/VoxyQuestBridgePlugin.kt
          grep -q 'ATOMIC_MOVE' third_party/Pojlib/src/main/java/pojlib/account/TokenPersistence.java
          if grep -q 'openxr/enabled=true' launcher/project.godot; then
            echo "Godot launcher must remain a flat non-OpenXR app"
            exit 1
          fi
          if grep -R -n -E 'com\.unity3d|UnityPlayerActivity|restartUnitySession|method_restartUnity|blank:unity-classes|wrapper/unityLibrary' third_party/Pojlib android launcher --exclude='vivecraft-client-config.json'; then
            echo "Unity engine reference remains in active code"
            exit 1
          fi

      - name: Download Godot 4.7.2 and export templates
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"

          curl --fail --location --retry 3 -o "$RUNNER_TEMP/templates.tpz" "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          mkdir -p "$RUNNER_TEMP/templates" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          cp -R "$RUNNER_TEMP/templates/templates/." "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import Godot project
        run: "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path launcher --editor --quit"

      - name: Verify launcher empty states and account UI
        run: |
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path launcher --script res://tests/home_smoke.gd
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path launcher --script res://tests/auth_flow.gd
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path launcher --script res://tests/install_bridge.gd

      - name: Capture launcher UI previews
        env:
          VOXYQUEST_PREVIEW_DIR: ${{ runner.temp }}/launcher-previews
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          xvfb-run -a -s "-screen 0 1536x1024x24" "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --path launcher --rendering-method gl_compatibility --script res://tests/ui_preview.gd

      - name: Upload launcher UI previews
        uses: actions/upload-artifact@v6
        with:
          name: launcher-ui-previews
          path: ${{ runner.temp }}/launcher-previews/*.png
          if-no-files-found: error

      - name: Prepare stable alpha signing key
        run: |
          base64 --decode .github/voxyquest-alpha.keystore.b64 > "$RUNNER_TEMP/voxyquest-alpha.keystore"
          keytool -list \
            -keystore "$RUNNER_TEMP/voxyquest-alpha.keystore" \
            -storepass android \
            -alias voxyquestalpha >/dev/null

      - name: Export flat Quest launcher APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/voxyquest-alpha.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: voxyquestalpha
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p launcher/build
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --path launcher --install-android-build-template --export-debug "Meta Quest" build/VoxyQuest-ci.apk
          test -s launcher/build/VoxyQuest-ci.apk
          python3 scripts/verify_native_apk.py launcher/build/VoxyQuest-ci.apk
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print launcher/build/VoxyQuest-ci.apk > "$RUNNER_TEMP/voxyquest-manifest.xml"
          grep -q 'android:extractNativeLibs="true"' "$RUNNER_TEMP/voxyquest-manifest.xml"

      - name: Upload Quest debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VoxyQuest-Quest-debug
          path: launcher/build/VoxyQuest-ci.apk
          if-no-files-found: error

      - name: Publish VoxyQuest GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish VoxyQuest APK release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.0-alpha.5
        run: |
          cp launcher/build/VoxyQuest-ci.apk launcher/build/VoxyQuest-Quest.apk
          cd launcher/build
          sha256sum VoxyQuest-Quest.apk > VoxyQuest-Quest.apk.sha256
          cat > release-notes.md <<EOF
          VoxyQuest alpha test build for Meta Quest.

          The Install button now starts the Android installer directly on button-down instead of depending only on the page callback. It immediately shows Starting, then live installer progress, Installed, or a visible Retry install message.

          This build keeps the stable alpha signing key and uses Android version code 5, so it can update directly over alpha.2-alpha.4.

          Built from commit: $GITHUB_SHA

          This is a prerelease test build. The committed alpha signing key is for test builds only and must not be used for a production release.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" VoxyQuest-Quest.apk VoxyQuest-Quest.apk.sha256 --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" VoxyQuest-Quest.apk VoxyQuest-Quest.apk.sha256 \
              --title "VoxyQuest v0.1.0-alpha.5" \
              --notes-file release-notes.md \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
