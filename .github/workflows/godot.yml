name: Godot Android smoke test

on:
  push:
    branches: [main, fix/vr-refresh-rate]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Check supported Minecraft versions and mods
        run: python3 launcher/tests/catalog_check.py

      - name: Install Android SDK components
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.1" \
            "build-tools;36.0.0" \
            "cmake;3.10.2.4988404" \
            "cmake;3.22.1" \
            "ndk;26.1.10909125" \
            "ndk;28.1.13356709"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Processed Minecraft/NeoForge clients and Vivecraft only change when the
      # preparation recipe changes. Reusing them avoids three installer runs and
      # a Vivecraft remap on every launcher or Android source edit.
      - name: Restore prepared NeoForge bundles
        id: neoforge-bundles
        uses: actions/cache/restore@v4
        with:
          path: third_party/Pojlib/src/main/assets/voxyquest/neoforge
          key: neoforge-bundles-${{ runner.os }}-${{ hashFiles('.github/workflows/godot.yml') }}

      - uses: actions/checkout@v6
        if: steps.neoforge-bundles.outputs.cache-hit != 'true'
        with:
          repository: QuestCraftPlusPlus/VivecraftMod
          ref: 612a11ca6a30791cae34d410328bc75d08246970
          path: quest-vivecraft-openxr

      - uses: actions/checkout@v6
        if: steps.neoforge-bundles.outputs.cache-hit != 'true'
        with:
          repository: QuestCraftPlusPlus/VivecraftMod
          ref: 60ffc92889fed3d1a92127b1b66516dd2354bbeb
          path: quest-vivecraft-openxr-1.21.4

      - uses: actions/checkout@v6
        if: steps.neoforge-bundles.outputs.cache-hit != 'true'
        with:
          repository: QuestCraftPlusPlus/VivecraftMod
          ref: 29599bbd50aa61d9408c5bc80299e1a7a406d7c4
          path: quest-vivecraft-openxr-1.21.1

      - name: Prepare NeoForge VR runtime
        if: steps.neoforge-bundles.outputs.cache-hit != 'true'
        run: |
          cd quest-vivecraft-openxr
          sed -i 's/^enabled_platforms=.*/enabled_platforms=neoforge/' gradle.properties
          bash ./gradlew :neoforge:remapJar --no-daemon
          cd ..
          ASSETS=third_party/Pojlib/src/main/assets/voxyquest/neoforge
          mkdir -p "$ASSETS" "$RUNNER_TEMP/neoforge-client"
          cp quest-vivecraft-openxr/neoforge/build/libs/vivecraft-1.21.5-1.3.4-neoforge.jar "$ASSETS/vivecraft.jar"
          for MC_VERSION in 1.21.4 1.21.1; do
            cd "quest-vivecraft-openxr-$MC_VERSION"
            sed -i 's/^enabled_platforms=.*/enabled_platforms=neoforge/' gradle.properties
            bash ./gradlew :neoforge:remapJar --no-daemon
            cd ..
            mkdir -p "$ASSETS/$MC_VERSION"
            cp "quest-vivecraft-openxr-$MC_VERSION/neoforge/build/libs/vivecraft-$MC_VERSION-1.2.5-neoforge.jar" "$ASSETS/$MC_VERSION/vivecraft.jar"
          done
          curl -fsSL --retry 3 https://maven.neoforged.net/releases/net/neoforged/neoforge/21.5.2-beta/neoforge-21.5.2-beta-installer.jar -o "$RUNNER_TEMP/neoforge-installer.jar"
          printf '{"profiles":{}}' > "$RUNNER_TEMP/neoforge-client/launcher_profiles.json"
          java -jar "$RUNNER_TEMP/neoforge-installer.jar" --installClient "$RUNNER_TEMP/neoforge-client"
          cp "$RUNNER_TEMP/neoforge-client/versions/neoforge-21.5.2-beta/neoforge-21.5.2-beta.json" "$ASSETS/version.json"
          cp "$RUNNER_TEMP/neoforge-client/libraries/net/neoforged/neoforge/21.5.2-beta/neoforge-21.5.2-beta-client.jar" "$ASSETS/client.jar"
          cp "$RUNNER_TEMP/neoforge-client/libraries/net/neoforged/neoforge/21.5.2-beta/neoforge-21.5.2-beta-universal.jar" "$ASSETS/universal.jar"
          MC_LIB="$RUNNER_TEMP/neoforge-client/libraries/net/minecraft/client/1.21.5-20250325.162830"
          cp "$MC_LIB/client-1.21.5-20250325.162830-srg.jar" "$ASSETS/minecraft-srg.jar"
          cp "$MC_LIB/client-1.21.5-20250325.162830-extra.jar" "$ASSETS/minecraft-extra.jar"
          unzip -Z1 "$ASSETS/minecraft-srg.jar" | grep -Fx 'net/minecraft/client/Minecraft.class'
          unzip -Z1 "$ASSETS/minecraft-extra.jar" | grep -Fx 'assets/.mcassetsroot'
          unzip -p "$ASSETS/vivecraft.jar" META-INF/neoforge.mods.toml | grep -q 'modId = "vivecraft"'

          # Each additional Minecraft version needs its own processed client and
          # profile. Keep them isolated so the NeoForge locator cannot load the
          # wrong game classes when instances switch versions.
          for spec in "1.21.4:21.4.150" "1.21.1:21.1.220"; do
            MC_VERSION="${spec%%:*}"
            NEO_VERSION="${spec#*:}"
            VERSION_ASSETS="$ASSETS/$MC_VERSION"
            CLIENT_DIR="$RUNNER_TEMP/neoforge-client-$MC_VERSION"
            mkdir -p "$VERSION_ASSETS" "$CLIENT_DIR"
            printf '{"profiles":{}}' > "$CLIENT_DIR/launcher_profiles.json"
            curl -fsSL --retry 3 "https://maven.neoforged.net/releases/net/neoforged/neoforge/$NEO_VERSION/neoforge-$NEO_VERSION-installer.jar" -o "$RUNNER_TEMP/neoforge-installer-$MC_VERSION.jar"
            java -jar "$RUNNER_TEMP/neoforge-installer-$MC_VERSION.jar" --installClient "$CLIENT_DIR"
            cp "$CLIENT_DIR/versions/neoforge-$NEO_VERSION/neoforge-$NEO_VERSION.json" "$VERSION_ASSETS/version.json"
            cp "$CLIENT_DIR/libraries/net/neoforged/neoforge/$NEO_VERSION/neoforge-$NEO_VERSION-client.jar" "$VERSION_ASSETS/client.jar"
            cp "$CLIENT_DIR/libraries/net/neoforged/neoforge/$NEO_VERSION/neoforge-$NEO_VERSION-universal.jar" "$VERSION_ASSETS/universal.jar"
            MC_LIB=$(find "$CLIENT_DIR/libraries/net/minecraft/client" -mindepth 1 -maxdepth 1 -type d -name "$MC_VERSION-*" -print -quit)
            test -n "$MC_LIB"
            cp "$MC_LIB"/client-*-srg.jar "$VERSION_ASSETS/minecraft-srg.jar"
            cp "$MC_LIB"/client-*-extra.jar "$VERSION_ASSETS/minecraft-extra.jar"
            unzip -Z1 "$VERSION_ASSETS/minecraft-srg.jar" | grep -Fx 'net/minecraft/client/Minecraft.class'
            unzip -Z1 "$VERSION_ASSETS/minecraft-extra.jar" | grep -Fx 'assets/.mcassetsroot'
            unzip -Z1 "$VERSION_ASSETS/universal.jar" | grep -Fx 'META-INF/neoforge.mods.toml'
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("third_party/Pojlib/src/main/assets/voxyquest/neoforge")
          for version, loader in (("1.21.5", "21.5.2-beta"), ("1.21.4", "21.4.150"), ("1.21.1", "21.1.220")):
              profile = root / ("" if version == "1.21.5" else version) / "version.json"
              data = json.loads(profile.read_text())
              assert data["id"] == f"neoforge-{loader}", profile
              game = data["arguments"]["game"]
              assert game[game.index("--fml.mcVersion") + 1] == version, profile
              assert isinstance(game[game.index("--fml.neoFormVersion") + 1], str), profile
              assert all(isinstance(arg, str) for key in ("jvm", "game") for arg in data["arguments"][key]), profile
          PY

      - name: Verify prepared NeoForge bundles
        run: |
          ASSETS=third_party/Pojlib/src/main/assets/voxyquest/neoforge
          for version in 1.21.5 1.21.4 1.21.1; do
            DIR="$ASSETS/$version"
            if [ "$version" = 1.21.5 ]; then DIR="$ASSETS"; fi
            for file in version.json client.jar universal.jar minecraft-srg.jar minecraft-extra.jar; do
              test -s "$DIR/$file"
            done
            unzip -Z1 "$DIR/minecraft-srg.jar" | grep -Fx 'net/minecraft/client/Minecraft.class'
            unzip -Z1 "$DIR/universal.jar" | grep -Fx 'META-INF/neoforge.mods.toml'
            test -s "$DIR/vivecraft.jar"
          done
          python3 - <<'PY'
          from pathlib import Path
          import tomllib, zipfile
          root = Path('third_party/Pojlib/src/main/assets/voxyquest/neoforge')
          for version in ('1.21.5', '1.21.4', '1.21.1'):
              jar = root / ('' if version == '1.21.5' else version) / 'vivecraft.jar'
              with zipfile.ZipFile(jar) as archive:
                  metadata = tomllib.loads(archive.read('META-INF/neoforge.mods.toml').decode())
                  assert any(mod['modId'] == 'vivecraft' for mod in metadata['mods']), jar
                  dependencies = metadata['dependencies']['vivecraft']
                  expected_range = '[1.21,1.21.1]' if version == '1.21.1' else f'[{version}]'
                  assert any(dep['modId'] == 'minecraft' and dep['versionRange'] == expected_range
                             for dep in dependencies), jar
                  assert 'org/vivecraft/client_vr/provider/openxr/MCOpenXR.class' in archive.namelist(), jar
          PY

      - name: Cache prepared NeoForge bundles
        if: steps.neoforge-bundles.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/Pojlib/src/main/assets/voxyquest/neoforge
          key: ${{ steps.neoforge-bundles.outputs.cache-primary-key }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Godot + Pojlib Android runtime
        run: |
          bash scripts/rebuild_glfw_bridge.sh
          python3 scripts/build_neoforge_glfw.py \
            third_party/Pojlib/src/main/assets/lwjgl/lwjgl-glfw-classes.jar \
            third_party/Pojlib/src/main/assets/voxyquest/neoforge/vivecraft.jar \
            third_party/Pojlib/src/main/assets/lwjgl/lwjgl-neoforge-classes.jar
          export VOXYQUEST_VIVECRAFT_TEST_JAR="$RUNNER_TEMP/vivecraft-original.jar"
          export VOXYQUEST_NEOFORGE_TEST_JAR="third_party/Pojlib/src/main/assets/voxyquest/neoforge/vivecraft.jar"
          export VOXYQUEST_NEOFORGE_LEGACY_TEST_JARS="third_party/Pojlib/src/main/assets/voxyquest/neoforge/1.21.4/vivecraft.jar:third_party/Pojlib/src/main/assets/voxyquest/neoforge/1.21.1/vivecraft.jar"
          curl --fail --location --retry 3 https://github.com/QuestCraftPlusPlus/VivecraftMod/releases/download/1.21.5-1.2.5-OpenXR/vivecraft-1.21.5-1.2.5-fabric.jar -o "$VOXYQUEST_VIVECRAFT_TEST_JAR"
          gradle -p android/bridge :plugin:syncToGodot --no-daemon
          mkdir -p "$RUNNER_TEMP/refresh-tests"
          curl -fsSL https://repo.maven.apache.org/maven2/org/ow2/asm/asm/9.7.1/asm-9.7.1.jar -o "$RUNNER_TEMP/refresh-tests/asm.jar"
          curl -fsSL https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar -o "$RUNNER_TEMP/refresh-tests/junit.jar"
          curl -fsSL https://repo.maven.apache.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar -o "$RUNNER_TEMP/refresh-tests/hamcrest.jar"
          javac -cp "$RUNNER_TEMP/refresh-tests/*" -d "$RUNNER_TEMP/refresh-tests" third_party/Pojlib/src/main/java/pojlib/util/VivecraftRefreshRateFix.java third_party/Pojlib/src/test/java/pojlib/util/VivecraftRefreshRateFixTest.java
          java -cp "$RUNNER_TEMP/refresh-tests:$RUNNER_TEMP/refresh-tests/*" org.junit.runner.JUnitCore pojlib.util.VivecraftRefreshRateFixTest
          javac -cp "$RUNNER_TEMP/refresh-tests/*" -d "$RUNNER_TEMP/refresh-tests" third_party/Pojlib/src/main/java/pojlib/util/ClasspathUtils.java third_party/Pojlib/src/test/java/pojlib/util/ClasspathUtilsTest.java
          java -cp "$RUNNER_TEMP/refresh-tests:$RUNNER_TEMP/refresh-tests/*" org.junit.runner.JUnitCore pojlib.util.ClasspathUtilsTest

      - name: Verify launcher and account runtime
        run: |
          test -f launcher/addons/VoxyQuestBridge/bin/debug/VoxyQuestBridge-debug.aar
          test -f launcher/addons/VoxyQuestBridge/bin/release/VoxyQuestBridge-release.aar
          test -f launcher/addons/VoxyQuestBridge/bin/debug/PojlibRuntime-debug.aar
          test -f launcher/addons/VoxyQuestBridge/bin/debug/MobileGlues-debug.aar
          test -f launcher/addons/VoxyQuestBridge/bin/release/MobileGlues-release.aar
          unzip -l launcher/addons/VoxyQuestBridge/bin/release/MobileGlues-release.aar | grep -q 'jni/arm64-v8a/libmobileglues.so'
          test -f launcher/addons/VoxyQuestBridge/bin/release/PojlibRuntime-release.aar
          test -f third_party/Pojlib/src/main/java/pojlib/PojlibRuntime.java
          test -f third_party/Pojlib/src/main/java/pojlib/account/LoginHelper.java
          test -f launcher/scripts/launcher.gd
          test -f launcher/scripts/home.gd
          test ! -e launcher/scripts/instance_install_ux.gd
          test -f launcher/tests/install_bridge.gd
          grep -q 'runtime.install_instance(new_name, version)' launcher/scripts/home.gd
          grep -q 'return bool(plugin.installInstance(instance_name, version))' launcher/scripts/runtime_bridge.gd
          test ! -e third_party/Pojlib/src/main/java/pojlib/UnityPlayerActivity.java
          test ! -e third_party/Pojlib/libs/unity-classes.jar
          test ! -e launcher/scripts/xr_bootstrap.gd
          grep -q 'xr_features/xr_mode=0' launcher/export_presets.cfg
          grep -q 'restoreSession' third_party/Pojlib/src/main/java/pojlib/account/LoginHelper.java
          grep -q 'restoreSession' android/bridge/plugin/src/main/java/dev/voxyquest/bridge/VoxyQuestBridgePlugin.kt
          grep -q 'ATOMIC_MOVE' third_party/Pojlib/src/main/java/pojlib/account/TokenPersistence.java
          if grep -q 'openxr/enabled=true' launcher/project.godot; then
            echo "Godot launcher must remain a flat non-OpenXR app"
            exit 1
          fi
          if grep -R -n -E 'com\.unity3d|UnityPlayerActivity|restartUnitySession|method_restartUnity|blank:unity-classes|wrapper/unityLibrary' third_party/Pojlib android launcher --exclude='vivecraft-client-config.json'; then
            echo "Unity engine reference remains in active code"
            exit 1
          fi

      - name: Download Godot 4.7.2 and export templates
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"

          curl --fail --location --retry 3 -o "$RUNNER_TEMP/templates.tpz" "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          mkdir -p "$RUNNER_TEMP/templates" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          cp -R "$RUNNER_TEMP/templates/templates/." "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import Godot project
        run: "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path launcher --editor --quit"

      - name: Verify launcher empty states and account UI
        run: |
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path launcher --script res://tests/home_smoke.gd
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path launcher --script res://tests/auth_flow.gd
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path launcher --script res://tests/install_bridge.gd

      - name: Capture launcher UI previews
        env:
          VOXYQUEST_PREVIEW_DIR: ${{ runner.temp }}/launcher-previews
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          xvfb-run -a -s "-screen 0 1536x1024x24" "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --path launcher --rendering-method gl_compatibility --script res://tests/ui_preview.gd

      - name: Upload launcher UI previews
        uses: actions/upload-artifact@v6
        with:
          name: launcher-ui-previews
          path: ${{ runner.temp }}/launcher-previews/*.png
          if-no-files-found: error

      - name: Prepare stable alpha signing key
        run: |
          base64 --decode .github/voxyquest-alpha.keystore.b64 > "$RUNNER_TEMP/voxyquest-alpha.keystore"
          keytool -list \
            -keystore "$RUNNER_TEMP/voxyquest-alpha.keystore" \
            -storepass android \
            -alias voxyquestalpha >/dev/null

      - name: Export flat Quest launcher APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/voxyquest-alpha.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: voxyquestalpha
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p launcher/build
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --path launcher --install-android-build-template --export-debug "Meta Quest" build/VoxyQuest-ci.apk
          test -s launcher/build/VoxyQuest-ci.apk
          python3 scripts/verify_native_apk.py launcher/build/VoxyQuest-ci.apk
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print launcher/build/VoxyQuest-ci.apk > "$RUNNER_TEMP/voxyquest-manifest.xml"
          grep -q 'android:extractNativeLibs="true"' "$RUNNER_TEMP/voxyquest-manifest.xml"
          grep -q 'android.permission.RECORD_AUDIO' "$RUNNER_TEMP/voxyquest-manifest.xml"
          unzip -Z1 launcher/build/VoxyQuest-ci.apk | grep -Fx 'assets/voxyquest/neoforge/minecraft-srg.jar'
          unzip -Z1 launcher/build/VoxyQuest-ci.apk | grep -Fx 'assets/voxyquest/neoforge/minecraft-extra.jar'
          for version in 1.21.4 1.21.1; do
            for asset in version.json client.jar universal.jar minecraft-srg.jar minecraft-extra.jar; do
              unzip -Z1 launcher/build/VoxyQuest-ci.apk | grep -Fx "assets/voxyquest/neoforge/$version/$asset"
            done
          done
          unzip -Z1 launcher/build/VoxyQuest-ci.apk | grep -Fx 'assets/lwjgl/lwjgl-neoforge-classes.jar'

      - name: Verify complete update APK
        run: |
          APK=launcher/build/VoxyQuest-ci.apk
          BUILD_TOOLS=/usr/local/lib/android/sdk/build-tools/35.0.1
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -F "package: name='dev.voxyquest.launcher' versionCode='23'"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          SIGNER_SHA=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          KEYSTORE_SHA=$(keytool -list -v -keystore "$RUNNER_TEMP/voxyquest-alpha.keystore" -storepass android -alias voxyquestalpha | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test -n "$SIGNER_SHA"
          test "$SIGNER_SHA" = "$KEYSTORE_SHA"
          unzip -p "$APK" 'classes*.dex' | strings > "$RUNNER_TEMP/voxyquest-dex-strings.txt"
          grep -Fq 'Lpojlib/install/VoxyQuestInstaller;' "$RUNNER_TEMP/voxyquest-dex-strings.txt"
          grep -Fq 'Ldev/voxyquest/bridge/LauncherOperations;' "$RUNNER_TEMP/voxyquest-dex-strings.txt"
          grep -Fq 'Ldev/voxyquest/bridge/ModrinthClient;' "$RUNNER_TEMP/voxyquest-dex-strings.txt"
          grep -Fq 'installInstance' "$RUNNER_TEMP/voxyquest-dex-strings.txt"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libmobileglues.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libltw.so'

      - name: Upload Quest debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VoxyQuest-Quest-debug
          path: launcher/build/VoxyQuest-ci.apk
          if-no-files-found: error

      - name: Publish VoxyQuest GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish VoxyQuest APK release v0.1.0-alpha.23'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.0-alpha.23
        run: |
          cp launcher/build/VoxyQuest-ci.apk launcher/build/VoxyQuest-Quest.apk
          cd launcher/build
          sha256sum VoxyQuest-Quest.apk > VoxyQuest-Quest.apk.sha256
          cat > release-notes.md <<EOF
          VoxyQuest alpha.23 test build for Meta Quest.

          This APK adds flatscreen NeoForge 1.21.4 and 1.21.1 instances with isolated mod folders and a reversible mod toggle. NeoForge 1.21.5 keeps its VR Vivecraft build and releases the Android mirror after OpenXR starts to reduce frame stalls. It uses Android version code 23 with the existing alpha signing key. Player settings and resolution are unchanged.

          Built from commit: $GITHUB_SHA

          This is a prerelease test build. The committed alpha signing key is for test builds only and must not be used for a production release.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" VoxyQuest-Quest.apk VoxyQuest-Quest.apk.sha256 --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" VoxyQuest-Quest.apk VoxyQuest-Quest.apk.sha256 \
              --title "VoxyQuest v0.1.0-alpha.23" \
              --notes-file release-notes.md \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
